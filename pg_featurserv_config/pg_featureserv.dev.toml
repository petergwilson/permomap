[Server]
# Accept connections on localhost only for development
HttpHost = "127.0.0.1"

# HTTP port for local development
HttpPort = 9000

# Advertise URLs relative to this server name and path
UrlBase = "http://localhost:9000"

# String to return for Access-Control-Allow-Origin header
CORSOrigins = "*"

# set Debug to true to run in debug mode
Debug = true

# Read html templates from this directory
AssetsPath = "./assets"

# Maximum duration for reading entire request (in seconds)
ReadTimeoutSec = 20

# Maximum duration for writing response (in seconds)
WriteTimeoutSec = 30

[Database]
# Database connection
# postgresql://username:password@host/dbname
DbConnection = "postgresql://postgres:postgres@localhost:5432/gis"

# Close pooled connections after this interval
# Use 0 to disable, otherwise interval is in seconds
DbPoolMaxConnLifeTime = "1h"

# Max database connections in pool
DbPoolMaxConns = 4

# In the query URL parameter, tables not in this schema will be qualified with their schema
# DefaultSchema = "public"

# Tables to expose via API. Leave blank to expose all tables
# Format: schema.table
# Example:
#   TableIncludes = ["public.table1", "myschema.table2"]
TableIncludes = []

# Tables to exclude from API
# Format: schema.table
TableExcludes = []

[Website]
# Base map tile URL pattern (uses OSM by default)
BasemapUrl = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
