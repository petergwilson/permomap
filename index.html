<!DOCTYPE html>
<html>
<head>
    <title>Permolat Mapping System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <script type="module" src="src/main.mjs"></script>
    <style>
        /* Responsive split: stack vertically on narrow screens */
        @media (max-width: 768px) {
            .split-row {
                display: block !important;
            }
            .split-col {
                width: 100% !important;
                margin-bottom: 0px;
            }
        }
        .split-row {
            display: flex;
            min-height: 300px;
            gap: 16px;
        }
        .split-col {
            display: flex;
            flex-direction: column;
            justify-content: stretch;
        }
        .map{
          height: 400px;
          width: 100%;
        }

        .modal {
    display: none; /* Hidden by default */
    position: fixed; /* Stay in place */
    z-index: 1; /* Sit on top */
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto; /* Enable scroll if needed */
    background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
    }

    .modal-content {
        background-color: #fefefe;
        margin: 15% auto; /* 15% from the top and centered */
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        max-width: 500px;
    }

    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
    }

    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    }
    #contextMenu {
      position: fixed;
      display: none;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.14);
      z-index: 1000;
      min-width: 180px;
    }
    #contextMenu .author {
      padding: 9px 16px 7px 16px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      color: #333;
    }
    #contextMenu .restore {
      cursor: pointer;
      padding: 8px 16px;
      transition: background 0.13s;
      font-size: 15px;
    }
    #contextMenu .restore:hover {
      background: #f3f5ff;
    }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="w3_container w3-bar w3-red w3-mobile w3-top" style="height:90px">
      <div class="w3-bar-item w3-mobile w3-left"><img src="images/permolat.jpg" style="padding-top:5px"/></div> 
      <div class="w3-bar-item w3-mobile w3-left"><h3 style="color:black; font-weight:bold">Permolat community tracks</h3></div> 
      <div class="w3-bar-item w3-button w3-mobile w3-middle"><h6 id="total_length" style="color:rgb(255, 255, 255); font-weight:normal"></h6></div>
      <div class="w3-bar-item w3-mobile w3-right w3-display-bottom w3-display-bottom"><p id="username_field"><p></div>
      <div class="w3-bar-item w3-button w3-mobile w3-right" id="login">Login</div>
      <div class="w3-bar-item w3-button w3-mobile w3-right">Get involved</div>
      <div class="w3-bar-item w3-button w3-mobile w3-right">About</div>


        <!-- Login modal-->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Login</h2>
                
                <!-- OAuth Login Buttons -->
                <div class="oauth-buttons">
                    <button type="button" class="oauth-btn google-btn" onclick="window.location.href='/auth/google'">
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                        Continue with Google
                    </button>
                    <button type="button" class="oauth-btn microsoft-btn" onclick="window.location.href='/auth/microsoft'">
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21"><path fill="#f25022" d="M0 0h10v10H0z"/><path fill="#00a4ef" d="M11 0h10v10H11z"/><path fill="#7fba00" d="M0 11h10v10H0z"/><path fill="#ffb900" d="M11 11h10v10H11z"/></svg>
                        Continue with Microsoft
                    </button>
                    <button type="button" class="oauth-btn linkedin-btn" onclick="window.location.href='/auth/linkedin'">
                        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#0077B5" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                        Continue with LinkedIn
                    </button>
                </div>
                
                <div class="divider">
                    <span>OR</span>
                </div>
                
                <!-- Traditional Login Form -->
                <form id="loginForm">
                    <input type="text" placeholder="Username" required id="login_name">
                    <input type="password" placeholder="Password" id="login_password" required>
                    <button type="button" id="login_submit_button">Login</button>
                </form>
                
                <div class="account-links">
                    <a href="#" id="manage_account_link">Manage Account</a>
                </div>
            </div>
        </div>

        <!-- Account Management Modal -->
        <div id="accountModal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeAccountModal">&times;</span>
                <h2>Account Management</h2>
                
                <div id="accountContent">
                    <div class="account-section">
                        <h3>Profile Information</h3>
                        <div id="profileInfo"></div>
                        <button type="button" id="editProfileBtn">Edit Profile</button>
                    </div>
                    
                    <div class="account-section">
                        <h3>Security</h3>
                        <button type="button" id="changePasswordBtn">Change Password</button>
                    </div>
                    
                    <div class="account-section danger-zone">
                        <h3>Danger Zone</h3>
                        <button type="button" id="deleteAccountBtn" class="danger-btn">Delete Account</button>
                    </div>
                </div>
                
                <!-- Edit Profile Form -->
                <form id="editProfileForm" style="display:none;">
                    <h3>Edit Profile</h3>
                    <input type="text" id="edit_username" placeholder="Username">
                    <input type="email" id="edit_email" placeholder="Email">
                    <button type="button" id="saveProfileBtn">Save Changes</button>
                    <button type="button" id="cancelEditBtn">Cancel</button>
                </form>
                
                <!-- Change Password Form -->
                <form id="changePasswordForm" style="display:none;">
                    <h3>Change Password</h3>
                    <input type="password" id="current_password" placeholder="Current Password" required>
                    <input type="password" id="new_password" placeholder="New Password" required>
                    <input type="password" id="confirm_password" placeholder="Confirm New Password" required>
                    <button type="button" id="savePasswordBtn">Change Password</button>
                    <button type="button" id="cancelPasswordBtn">Cancel</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Space for navbar -->
    <div style="margin-top:100px"></div>

    <!-- Responsive Row (2/3 left, 1/3 right on desktop, stacked on mobile) -->
    <div class="w3-container" id="root">
        <div class="split-row">
            <!-- Left Pane (2/3 width on desktop) -->
            <div class="split-col" style="width:66.66%; height:900px">       
                  <!-- Div to hold the map object, map is loaded dynamically at load time through the Javascript library-->
                  <div id="map" class="map"></div>
                  <!-- Button to reopen panel-->
                  
            </div>

            <!-- Right Pane (1/3 width on desktop) -->
            <div class="split-col" style="width:33.33%;">
                <div class="w3-pale-green w3-round-large" id="dynamicContent" style="height:900px;">
                  <pre id="title"></pre>  
                  <div id="info" style="height:500px; overflow:auto" ></div>
                  <div id="contextMenu">
                    <div class="author"></div>
                    <div class="restore">Restore text</div>
                  </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom panel (full width) --> 
    <div id="bottom-panel" class="w3-container w3-green w3-center" style="margin-top:15px;">

    </div>
    

</body>
</html>
