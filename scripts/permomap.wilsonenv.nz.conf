# Apache2 virtual host for permomap.wilsonenv.nz
# Routes:
#   /api/*  -> Node.js backend (port 3000)
#   /       -> static files from /var/www/permomap

# Redirect all HTTP to HTTPS
<VirtualHost *:80>
    ServerName permomap.wilsonenv.nz
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName permomap.wilsonenv.nz

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/permomap.wilsonenv.nz/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/permomap.wilsonenv.nz/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Node.js API backend
    <Location /api>
        ProxyPreserveHost On
        ProxyPass        http://127.0.0.1:3000/api
        ProxyPassReverse http://127.0.0.1:3000/api
    </Location>

    # OAuth routes
    <Location /auth>
        ProxyPreserveHost On
        ProxyPass        http://127.0.0.1:3000/auth
        ProxyPassReverse http://127.0.0.1:3000/auth
    </Location>

    # Static files
    DocumentRoot /var/www/permomap
    <Directory /var/www/permomap>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        AuthType Basic
        AuthName "Permomap"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
        # SPA fallback: serve index.html for unknown paths
        FallbackResource /index.html
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/permomap_error.log
    CustomLog ${APACHE_LOG_DIR}/permomap_access.log combined
</VirtualHost>
