# Apache2 virtual host for featureserver2.wilsonenv.nz
# Routes:
#   /  → pg_featureserv (port 8080)

<VirtualHost *:80>
    ServerName featureserver2.wilsonenv.nz
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName featureserver2.wilsonenv.nz

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/featureserver2.wilsonenv.nz/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/featureserver2.wilsonenv.nz/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    # ── pg_featureserv ────────────────────────────────────────────────────────
    <Location />
        ProxyPreserveHost On
        ProxyPass        http://127.0.0.1:8080/
        ProxyPassReverse http://127.0.0.1:8080/
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/featureserver2_error.log
    CustomLog ${APACHE_LOG_DIR}/featureserver2_access.log combined
</VirtualHost>
