# Apache2 virtual host for tileserver2.wilsonenv.nz
# Routes:
#   /  → pg_tileserv (port 7800)

# Redirect all HTTP to HTTPS
<VirtualHost *:80>
    ServerName tileserver2.wilsonenv.nz
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName tileserver2.wilsonenv.nz

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/tileserver2.wilsonenv.nz/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/tileserver2.wilsonenv.nz/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # ── pg_tileserv ───────────────────────────────────────────────────────────
    <Location />
        ProxyPreserveHost On
        ProxyPass        http://127.0.0.1:7800/
        ProxyPassReverse http://127.0.0.1:7800/
        Header always set Access-Control-Allow-Origin  "*"
        Header always set Access-Control-Allow-Methods "GET, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type"
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/tileserver2_error.log
    CustomLog ${APACHE_LOG_DIR}/tileserver2_access.log combined
</VirtualHost>
