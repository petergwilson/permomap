name: Mirror to Permolat Trust

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Permolat Trust
        env:
          GH_TOKEN: ${{ secrets.PERMOLAT_TRUST_MIRROR_TOKEN }}
        run: |
          git remote add trust \
            "https://x-access-token:${GH_TOKEN}@github.com/Permolat-Trust-NZ/permomap.git"

          git push trust main
          git push trust --tags
