receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 512
    check_interval: 15

exporters:

  # Prometheus for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      service: "permomap"

  # Loki for logs - DISABLED
#  loki:
#    endpoint: http://loki:3100/loki/api/v1/push
#    tenant_id: "permomap"
  
  # OTLP HTTP exporter for Loki - DISABLED
#  otlphttp:
#    endpoint: http://0.0.0.0:3100/otlp

  # Jaeger exporter - DISABLED
#  jaeger:
#    endpoint: jaeger:14250
#    tls:
#      insecure: true

service:
  pipelines:
    # Traces pipeline - DISABLED (no exporters)
#    traces:
#      receivers: [otlp]
#      processors: [memory_limiter, batch]
#      exporters: []

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    # Logs pipeline - DISABLED (no exporters)
#    logs:
#      receivers: [otlp]
#      processors: [memory_limiter, batch]
#      exporters: []

  extensions: []
