services:
  postgres:
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: permolatmap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./permolat_tracks_june12.sql:/docker-entrypoint-initdb.d/permolat_tracks_june12.sql
      - ./sql-dumps/permomap_dev_dump_20250706.sql_dump:/docker-entrypoint-initdb.d/permomap_dev_dump_20250706.sql_dump
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d permolatmap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pg_featureserv:
    image: pramsey/pg_featureserv:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres/permolatmap
    ports:
      # Not using HTTPS on port 9050 here because it's not worth having to setup a TLS certificate for local dev
      - '9000:9000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
